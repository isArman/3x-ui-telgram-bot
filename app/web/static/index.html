<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>فروشگاه اشتراک</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <div class="brand-name" id="brand-name">فروشگاه</div>
          <div class="brand-sub" id="brand-sub">در حال بارگذاری…</div>
        </div>
      </div>
      <button class="balance-pill" id="balance-pill" type="button">
        <span id="balance-value">—</span> تومان
      </button>
    </header>

    <main id="view" class="view">
      <div class="loader">در حال بارگذاری…</div>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="home" type="button"><span>🏠</span>خانه</button>
      <button class="tab" data-tab="plans" type="button"><span>📦</span>پلن‌ها</button>
      <button class="tab" data-tab="wallet" type="button"><span>👛</span>کیف پول</button>
      <button class="tab" data-tab="orders" type="button"><span>🧾</span>سفارش‌ها</button>
      <button class="tab" data-tab="referral" type="button"><span>🎁</span>دعوت</button>
      <button class="tab tab-admin" data-tab="admin" type="button" hidden><span>⚙️</span>مدیریت</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <h3 id="sheet-title">جزئیات</h3>
      <button class="sheet-close" id="sheet-close" type="button">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="/assets/app.js"></script>
</body>
</html>
