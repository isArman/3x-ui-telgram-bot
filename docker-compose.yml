services:
  bot:
    build: .
    container_name: vpn_bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/db.sqlite3
    ports:
      # The Mini App web server, published on the loopback only — nginx
      # terminates TLS in front of it. WEB_PORT lets a second instance (UAT)
      # run beside the production one.
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/app/data
