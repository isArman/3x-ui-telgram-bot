version: "3.8"

services:
  bot:
    build: .
    container_name: vpn_bot
    restart: always
    ports:
      - "${WORKER_API_PORT:-8080}:8080"

    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - DATABASE_URL=sqlite+aiosqlite:///data/db.sqlite3
      - XUI_URL=${XUI_URL}
      - XUI_PUBLIC_URL=${XUI_PUBLIC_URL}
      - XUI_USERNAME=${XUI_USERNAME}
      - XUI_PASSWORD=${XUI_PASSWORD}
      - XUI_INBOUND_ID=${XUI_INBOUND_ID:-1}
      - PROVISION_MODE=${PROVISION_MODE:-remote}
      - WORKER_SECRET=${WORKER_SECRET}
      - WORKER_API_HOST=0.0.0.0
      - WORKER_API_PORT=8080
      - CARD_NUMBER=${CARD_NUMBER}
      - CARD_HOLDER=${CARD_HOLDER}

    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: vpn_panel_worker
    restart: always
    command: ["python", "-m", "app.worker.main"]
    profiles:
      - worker

    environment:
      - BOT_API_URL=${BOT_API_URL}
      - WORKER_SECRET=${WORKER_SECRET}
      - XUI_URL=${WORKER_XUI_URL:-http://127.0.0.1:2053}
      - XUI_PUBLIC_URL=${XUI_PUBLIC_URL}

    network_mode: host
