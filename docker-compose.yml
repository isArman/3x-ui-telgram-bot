services:
  bot:
    build: .
    container_name: vpn_bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/db.sqlite3
    ports:
      # The Mini App web server, published on the loopback only — nginx
      # terminates TLS in front of it.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
